name: Sync AnimeGameData & Lunaris Snapshot

on:
  schedule:
    # Daily sync at 09:00 UTC for released AnimeGameData & unreleased Lunaris fallback
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python ETL dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild static combat, weapon, and enemy schemas
        run: |
          python scripts/build_kit_profiles.py
          python scripts/build_weapons_index.py
          python scripts/build_enemies_index.py

      - name: Sync live snapshot fallback
        run: node scripts/sync-snapshot.mjs --force

      - name: Commit updated game data artifacts
        run: |
          if git status --porcelain data/kit_profiles.json data/set_vectors.json data/weapons_index.json data/enemies_index.json data/live-snapshot.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/kit_profiles.json data/set_vectors.json data/weapons_index.json data/enemies_index.json data/live-snapshot.json
            git commit -m "chore: sync AnimeGameData & Lunaris artifacts"
            git push
          else
            echo "No data artifact changes to commit."
          fi
