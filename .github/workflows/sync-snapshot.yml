name: Sync Game Data Snapshot

on:
  schedule:
    # Check Lunaris version.json every 12 hours; exits early if unchanged
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check version & sync snapshot if updated
        run: node scripts/sync-snapshot.mjs

      - name: Commit updated snapshot
        run: |
          if git status --porcelain data/live-snapshot.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live-snapshot.json
            git commit -m "chore: sync game data snapshot"
            git push
          else
            echo "No snapshot changes to commit."
          fi
